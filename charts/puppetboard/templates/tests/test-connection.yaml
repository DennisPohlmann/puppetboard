apiVersion: v1
kind: Pod
metadata:
  name: {{ include "puppetboard.fullname" . | trunc 52 | trimSuffix "-" }}-test
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "puppetboard.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  {{- with .Values.podSecurityContext }}
  securityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: status
      image: {{ include "puppetboard.image" . }}
      command:
        - python
        - -c
        - |
          import sys, urllib.request
          url = 'http://{{ include "puppetboard.fullname" . }}:{{ .Values.service.port }}/status'
          sys.exit(0 if urllib.request.urlopen(url, timeout=10).status == 200 else 1)
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
