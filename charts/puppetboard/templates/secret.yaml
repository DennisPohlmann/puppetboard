{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
{{ include "puppetboard.metadata" (dict "context" . "name" (include "puppetboard.fullname" .)) }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.secretKey | quote }}
{{- end }}
{{- if and .Values.puppetdb.tls.enabled (not .Values.puppetdb.tls.existingSecret) }}
---
apiVersion: v1
kind: Secret
{{ include "puppetboard.metadata" (dict "context" . "name" (include "puppetboard.tlsSecretName" .)) }}
type: Opaque
stringData:
  ca.crt: {{ .Values.puppetdb.tls.ca | quote }}
  tls.crt: {{ .Values.puppetdb.tls.cert | quote }}
  tls.key: {{ .Values.puppetdb.tls.key | quote }}
{{- end }}
