suite: secrets
templates:
  - templates/secret.yaml
tests:
  - it: creates the SECRET_KEY secret and the PuppetDB certificate secret
    set:
      secretKey: s3cret
      puppetdb.tls.ca: CA
      puppetdb.tls.cert: CERT
      puppetdb.tls.key: KEY
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: stringData.SECRET_KEY
          value: s3cret
        documentIndex: 0
      - equal:
          path: stringData["tls.key"]
          value: KEY
        documentIndex: 1
  - it: creates nothing with existing secrets
    set:
      existingSecret: mine
      puppetdb.tls.existingSecret: mine-tls
    asserts:
      - hasDocuments:
          count: 0
