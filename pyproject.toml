[project]
name = "puppetboard-dp"
version = "8.2.1"
description = "Web frontend, read-only JSON API and MCP server for PuppetDB (fork of puppetboard)"
authors = [
    { name = "Vox Pupuli", email = "voxpupuli@groups.io" },
    { name = "Dennis Pohlmann", email = "50769263+DennisPohlmann@users.noreply.github.com" },
]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12,<4"
keywords = ["puppet", "puppetdb", "puppetboard", "mcp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "click>=8.1.7,<9",
    "flask>=3.1.0,<4",
    "commonmark>=0.9.1,<0.10",
    "flask-apscheduler>=1.13.1,<2",
    "flask-caching>=2.3.0,<3",
    "flask-wtf>=1.2.2,<2",
    "idna>=3.10,<4",
    "requests>=2.32.3,<3",
    "packaging>=24.2,<27.0",
    "pyparsing>=3.2.0,<4",
    "pypuppetdb>=3.2.0,<4",
    "PyYAML>=6.0,<7",
    "typing-extensions>=4.12.2,<5",
    "wtforms>=3.3.0,<4",
    "zipp>=3.21,<5.0",
    # ASGI entry point puppetboard.asgi:app with the MCP server
    "gunicorn>=24,<28",  # 24.0 brought the native "-k asgi" worker
    "mcp>=2.3.0,<3",
    "a2wsgi>=1.10.10,<2",
]

[project.optional-dependencies]
# kept empty so 'puppetboard-dp[mcp]' from 8.2.0 still installs
mcp = []

[project.urls]
Repository = "https://github.com/DennisPohlmann/puppetboard"
Upstream = "https://github.com/voxpupuli/puppetboard"

[tool.poetry]
packages = [
    { include = "puppetboard" },
]
include = [
    { path = "THIRD_PARTY.md", format = "sdist" },
    { path = "CHANGELOG.md", format = "sdist" },
]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
ignore_missing_imports = true
ignore_errors = false
pretty = true

[[tool.mypy.overrides]]
module = "puppetboard.docker_settings"
ignore_errors = true
