name: publish 🐍 egg to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build-n-publish:

    runs-on: ubuntu-latest
    # must match the environment of the trusted publisher on PyPI
    environment:
      name: pypi
      url: https://pypi.org/project/puppetboard-dp/
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # PyPI Trusted Publishing (OIDC), no API token

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: 3.12
      - name: Install dependencies
        run: |
          sudo apt install python3-poetry
      - name: Build
        run: |
          poetry install --with=test
          poetry build
      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
      - name: Create release in GitHub
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
        with:
          tag_name: ${{ github.ref }}
          release_name: ${{ github.ref }}
          draft: false
          prerelease: false
