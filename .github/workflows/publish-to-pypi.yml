name: publish 🐍 egg to PyPI

on:
  push:
    tags:
      # release tags are plain versions without a v, e.g. 8.2.0
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  build-n-publish:

    runs-on: ubuntu-latest
    # must match the environment of the trusted publisher on PyPI
    environment:
      name: pypi
      url: https://pypi.org/project/puppetboard-dp/
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # PyPI Trusted Publishing (OIDC), no API token

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # history and origin/main for the main check
      - name: the tag must be on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::tag $GITHUB_REF_NAME is not on main"; exit 1; }
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: 3.12
      - name: Install dependencies
        run: |
          sudo apt install python3-poetry
      - name: Test and build
        run: |
          [ "$(poetry version -s)" = "$GITHUB_REF_NAME" ] ||
            { echo "::error::tag $GITHUB_REF_NAME does not match the version in pyproject.toml"; exit 1; }
          poetry install --with=test --extras mcp
          poetry run pytest -q
          poetry build
      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
      - name: Create release in GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
