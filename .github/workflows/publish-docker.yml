name: publish 🐳 Docker image

# Builds the container image for amd64 and arm64 and pushes it to the
# GitHub Container Registry only: ghcr.io/dennispohlmann/puppetboard.
on:
  push:
    tags:
      # release tags are plain versions without a v, e.g. 8.2.0
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build-and-push-container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # history and origin/main for the main check
      - name: the tag must be on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::tag $GITHUB_REF_NAME is not on main"; exit 1; }
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # ghcr.io needs a lowercase repository name
          tags: |
            ghcr.io/dennispohlmann/puppetboard:${{ github.ref_name }}
            ghcr.io/dennispohlmann/puppetboard:latest
