name: chart

# Checks the Helm chart in charts/puppetboard on every push and pull request:
# helm lint (default and ci values, values.schema.json), unit tests
# (helm-unittest) and kubeconform against the Kubernetes API. On a release
# tag it also publishes the chart as OCI artifact on ghcr.io (job publish).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CHART: charts/puppetboard
  HELM_VERSION: v4.3.2

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}
      - name: helm lint (default and ci values)
        run: |
          for f in "$CHART"/ci/*-values.yaml; do helm lint --strict "$CHART" -f "$f"; done
      - name: unit tests (helm-unittest)
        # as the runner user, so the tests may create their snapshot folder
        run: docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD/$CHART:/apps" helmunittest/helm-unittest:latest --strict .
      - name: kubeconform (rendered manifests against the Kubernetes API)
        run: |
          for f in "$CHART"/ci/*-values.yaml; do
            helm template puppetboard "$CHART" -f "$f" --kube-version 1.33.0 |
              docker run --rm -i ghcr.io/yannh/kubeconform:latest -strict -summary \
                -kubernetes-version 1.33.0 -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done
      - name: package (check only, not pushed)
        run: helm package "$CHART" --destination dist

  # On a release tag (plain version, e.g. 8.2.0): package the chart with the
  # tag as chart and app version and push it to
  # oci://ghcr.io/dennispohlmann/charts/puppetboard.
  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # history and origin/main for the main check
      - name: the tag must be on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::tag $GITHUB_REF_NAME is not on main"; exit 1; }
      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}
      - name: check the tag is a plain version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag $TAG is not a plain version"; exit 1; }
      - name: package and push
        env:
          TAG: ${{ github.ref_name }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "$CHART" --version "$TAG" --app-version "$TAG" --destination dist
          helm push "dist/puppetboard-$TAG.tgz" oci://ghcr.io/dennispohlmann/charts
